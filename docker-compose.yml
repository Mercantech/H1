# Dokploy-deploy: docker compose -f ./docker-compose.yml up -d --build
#
# Routing (samme mønster som øvrige Mercantec-apps):
#   1. Cloudflare: *.mercantec.tech (wildcard CNAME → tunnel)
#   2. Tunnel ingress: *.mercantec.tech → http://localhost:80
#   3. Traefik (Dokploy):
#        Host(`h1-t.mercantec.tech`)  → web:8080
#        Host(`h1-db.mercantec.tech`) → pgweb:8081
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-h1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h1}
      POSTGRES_DB: ${POSTGRES_DB:-h1db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h1} -d ${POSTGRES_DB:-h1db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    environment:
      # Automatisk forbindelse til postgres i samme compose-netværk
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-h1}:${POSTGRES_PASSWORD:-h1}@postgres:5432/${POSTGRES_DB:-h1db}?sslmode=disable
      PGWEB_LOCK_SESSION: "1"
      # Valgfri basic auth (anbefales i produktion) — sæt via Dokploy/Infisical
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h1t-pgweb.rule=Host(`${PGWEB_DOMAIN:-h1-db.mercantec.tech}`)
      - traefik.http.routers.h1t-pgweb.entrypoints=web
      - traefik.http.routers.h1t-pgweb.service=h1t-pgweb
      - traefik.http.services.h1t-pgweb.loadbalancer.server.port=8081

  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile.web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__h1db: Host=postgres;Port=5432;Database=${POSTGRES_DB:-h1db};Username=${POSTGRES_USER:-h1};Password=${POSTGRES_PASSWORD:-h1}
      HealthChecks__Enabled: "true"
      Infisical__ClientId: ${INFISICAL__CLIENTID:-}
      Infisical__ClientSecret: ${INFISICAL__CLIENTSECRET:-}
      Infisical__ProjectId: ${INFISICAL__PROJECTID:-}
      Infisical__EnvironmentSlug: ${INFISICAL__ENVIRONMENTSLUG:-}
      Infisical__SecretPath: ${INFISICAL__SECRETPATH:-/}
      Infisical__HostUri: ${INFISICAL__HOSTURI:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h1t-web.rule=Host(`${APP_DOMAIN:-h1-t.mercantec.tech}`)
      - traefik.http.routers.h1t-web.entrypoints=web
      - traefik.http.routers.h1t-web.service=h1t-web
      - traefik.http.services.h1t-web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  postgres-data:
